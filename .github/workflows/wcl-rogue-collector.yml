name: WCL Rogue Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/wcl_collect_rogue.py"
      - ".github/workflows/wcl-rogue-collector.yml"

permissions:
  contents: write

concurrency:
  group: wcl-rogue-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run WCL Rogue collector
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python3 scripts/wcl_collect_rogue.py

      - name: Save collected WCL data
        run: |
          git config user.name "wcl-research-bot"
          git config user.email "wcl-research-bot@users.noreply.github.com"

          git add data/wcl/rogue

          if ! git diff --cached --quiet; then
            git commit -m "Update WCL Rogue rankings data"
            git push
          else
            echo "No WCL data changes to commit."
          fi
