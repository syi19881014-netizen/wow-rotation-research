name: WCL API Smoke Test

on:
  push:
    paths:
      - ".github/workflows/wcl-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-wcl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Warcraft Logs API
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        shell: bash
        run: |
          mkdir -p data/status

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ -z "$WCL_CLIENT_ID" ] || [ -z "$WCL_CLIENT_SECRET" ]; then
            jq -n \
              --arg time "$NOW" \
              '{
                ok:false,
                checked_at_utc:$time,
                stage:"secrets",
                message:"WCL_CLIENT_ID or WCL_CLIENT_SECRET is missing"
              }' > data/status/wcl_api_status.json
            exit 0
          fi

          TOKEN=$(
            curl -fsS \
              -u "${WCL_CLIENT_ID}:${WCL_CLIENT_SECRET}" \
              -d "grant_type=client_credentials" \
              https://www.warcraftlogs.com/oauth/token \
            | jq -r '.access_token // empty'
          ) || TOKEN=""

          if [ -z "$TOKEN" ]; then
            jq -n \
              --arg time "$NOW" \
              '{
                ok:false,
                checked_at_utc:$time,
                stage:"oauth",
                message:"Failed to obtain WCL access token"
              }' > data/status/wcl_api_status.json
            exit 0
          fi

          RESPONSE=$(
            curl -fsS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"query":"{ rateLimitData { limitPerHour pointsSpentThisHour pointsResetIn } }"}' \
              https://www.warcraftlogs.com/api/v2/client
          ) || RESPONSE=""

          LIMIT=$(echo "$RESPONSE" | jq -r '.data.rateLimitData.limitPerHour // empty')
          SPENT=$(echo "$RESPONSE" | jq -r '.data.rateLimitData.pointsSpentThisHour // empty')
          RESET=$(echo "$RESPONSE" | jq -r '.data.rateLimitData.pointsResetIn // empty')

          if [ -z "$LIMIT" ]; then
            jq -n \
              --arg time "$NOW" \
              '{
                ok:false,
                checked_at_utc:$time,
                stage:"graphql",
                message:"WCL GraphQL API request failed"
              }' > data/status/wcl_api_status.json
            exit 0
          fi

          jq -n \
            --arg time "$NOW" \
            --argjson limit "$LIMIT" \
            --argjson spent "$SPENT" \
            --argjson reset "$RESET" \
            '{
              ok:true,
              checked_at_utc:$time,
              oauth:"client_credentials",
              wcl_api:"connected",
              rate_limit:{
                limit_per_hour:$limit,
                points_spent_this_hour:$spent,
                points_reset_in_seconds:$reset
              },
              secrets_exposed:false
            }' > data/status/wcl_api_status.json

      - name: Save test result
        run: |
          git config user.name "wcl-research-bot"
          git config user.email "wcl-research-bot@users.noreply.github.com"

          git add data/status/wcl_api_status.json

          if ! git diff --cached --quiet; then
            git commit -m "Update WCL API connection status"
            git push
          fi
