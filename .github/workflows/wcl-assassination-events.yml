name: WCL Assassination Event Research

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/wcl_collect_assassination_events.py"
      - "scripts/wcl_collect_assassination_coverage.py"
      - ".github/workflows/wcl-assassination-events.yml"

permissions:
  contents: write

concurrency:
  group: wcl-assassination-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Collect enemy-side Assassination coverage samples
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_EVENT_REPORTS: "8"
        run: python3 scripts/wcl_collect_assassination_coverage.py

      - name: Save event research
        if: always()
        run: |
          git config user.name "wcl-research-bot"
          git config user.email "wcl-research-bot@users.noreply.github.com"
          git add data/wcl/rogue/assassination-events
          if ! git diff --cached --quiet; then
            git commit -m "Update Assassination event-level WCL research"
            git push
          else
            echo "No WCL event changes to commit."
          fi
