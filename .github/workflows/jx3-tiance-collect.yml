name: JX3 Tiance source conversion and candidate audit
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/jx3-tiance-collect.yml"
      - "research/jx3/cangsheng-zhushi/scripts/import_skill_snapshot.py"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download recent source and produce non-verified candidates
        run: python research/jx3/cangsheng-zhushi/scripts/import_skill_snapshot.py
      - name: Commit imported candidates and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/jx3/cangsheng-zhushi/data/tiance/skills_candidates_20261013.csv
          git add research/jx3/cangsheng-zhushi/data/tiance/skills_name_audit_20261013.csv
          git add research/jx3/cangsheng-zhushi/data/tiance/skill_import_report.json
          git add research/jx3/cangsheng-zhushi/data/tiance/skills_priority_audit_20261013.csv
          if ! git diff --cached --quiet; then
            git commit -m "research(jx3): import GBK skill candidates and source audit"
            git push
          fi
